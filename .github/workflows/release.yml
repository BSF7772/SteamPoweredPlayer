# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release pipeline. Pushing a version tag (v0.1.0) builds the Windows installer on a GitHub-hosted runner and attaches it, with its
# SHA-256, to a GitHub release. Run by hand (Actions tab -> Run workflow) it builds the installer and keeps it as a build artifact,
# without making a release.
#
# Nothing here is trusted beyond what the repository pins: libmpv, ffmpeg and Inno Setup come from tools/deps.json and are
# SHA-256 checked by tools/bootstrap.ps1. Third-party actions are pinned to a commit.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 0.1.0 (a test build: no release is created)'
        required: true
        default: '0.0.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Build the Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write   # attach the installer to the release (only this job, only on a tag)
    steps:
      - name: Check out (with the FastEncoder submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') } else { $v = '${{ inputs.version }}' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "not a version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Fetch the pinned tools (libmpv, ffmpeg, Inno Setup; SHA-256 checked)
        shell: pwsh
        run: tools\bootstrap.ps1 -Release

      - name: Unit tests
        shell: pwsh
        run: dotnet test tests -c Release -nologo --verbosity minimal

      - name: Build the installer
        shell: pwsh
        run: tools\package.ps1 -Version '${{ steps.ver.outputs.version }}' -SkipBootstrap

      - name: Smoke test the installer (silent install, the app's own self-test)
        shell: pwsh
        run: |
          $setup = "dist\SteamPoweredPlayer-${{ steps.ver.outputs.version }}-Setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'spp-install'
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=',"/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          foreach ($f in 'SteamPoweredPlayer.exe','libmpv-2.dll','ffmpeg.exe','App.xbf') { if (-not (Test-Path (Join-Path $dir $f))) { throw "not installed: $f" } }
          $report = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $t = Start-Process (Join-Path $dir 'SteamPoweredPlayer.exe') -ArgumentList '--selftest', $report -PassThru
          if (-not $t.WaitForExit(600000)) { $t | Stop-Process -Force; throw 'self-test timed out' }
          if (Test-Path $report) { Get-Content $report | Select-Object -Last 40 }
          if ($t.ExitCode -ne 0) { throw "self-test failed (exit code $($t.ExitCode))" }

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SteamPoweredPlayer-${{ steps.ver.outputs.version }}-Setup
          path: |
            dist/SteamPoweredPlayer-*-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $notes = @"
          ## Install
          Download **SteamPoweredPlayer-$env:VERSION-Setup.exe** below and run it. It installs for your user only (no administrator
          prompt), adds a Start menu entry and a desktop shortcut, and bundles everything it needs (libmpv, ffmpeg and the .NET runtime).
          Uninstall it from Windows Settings > Apps. Your settings and data are never removed.

          Windows 11 (or Windows 10 version 2004 or later), 64-bit.

          **Windows SmartScreen:** the installer is not code-signed yet, so Windows may show "Windows protected your PC". Choose
          **More info > Run anyway**. You can check the download against ``SHA256SUMS.txt``:
          ``Get-FileHash SteamPoweredPlayer-$env:VERSION-Setup.exe -Algorithm SHA256``

          ## Source and licences
          SteamPoweredPlayer is GPL-3.0-or-later. The installer bundles GPL builds of libmpv and ffmpeg; the exact versions, their source
          and the written source offer are in [docs/third-party.md](https://github.com/${{ github.repository }}/blob/$env:TAG/docs/third-party.md).
          The source of this release is the tag **$env:TAG** of this repository.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          gh release create $env:TAG "dist/SteamPoweredPlayer-$env:VERSION-Setup.exe" "dist/SHA256SUMS.txt" `
            --repo '${{ github.repository }}' --title "SteamPoweredPlayer $env:VERSION" --notes-file $notesFile --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
